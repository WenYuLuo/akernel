schema_version: 1
profile: standalone
internal_security: network
namespace: akernel
service_overrides:
  master:
    config:
      placement: spread
  node-manager:
    config:
      rrt_env:
        ADX_RRT_CONTROL_SOCKET_PATH: /run/akernel
      resource_source:
        disk_path: /home/akernel
  edge:
    env:
      ADX_DATA_PLANE_EDGE_FRONTEND_PLAIN_BIND: 0.0.0.0:8080
      ADX_DATA_PLANE_EDGE_FRONTEND_ALLOWED_CLIENT_CIDRS: 0.0.0.0/0
environment:
  rootfs:
    runtime_class: runsc
    type: local
    path: /opt/akernel/runtime/akernel-runtime-rootfs.img
    readonly: false
  bootstrap:
    type: erofs
    root: /opt/akernel/runtime/akernel-runtime-rootfs.img
    target: /__adx
    entrypoint:
      - /__adx/usr/local/bin/rrt-runtime
    image_process_config: /etc/adx-image-process.json
  env:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
