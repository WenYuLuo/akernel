{{- if .Values.environmentDetails.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: prometheus-details
  namespace: {{ .Release.Namespace }}
spec:
  selector: {component: prometheus-details}
  ports:
  - {name: web, port: 9090, targetPort: web}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus-details
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  serviceName: prometheus-details
  selector:
    matchLabels: {component: prometheus-details}
  template:
    metadata:
      labels: {component: prometheus-details}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus/details-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: "{{ .Values.prometheusServer.image.repository }}:{{ .Values.prometheusServer.image.tag }}"
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time={{ .Values.environmentDetails.retentionTime }}
        ports:
        - {name: web, containerPort: 9090}
        readinessProbe:
          httpGet: {path: /-/ready, port: web}
        resources:
          {{- toYaml .Values.environmentDetails.resources | nindent 10 }}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus, readOnly: true}
        - {name: data, mountPath: /prometheus}
      volumes:
      - name: config
        configMap: {name: prometheus-details}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .Values.environmentDetails.storageClassName }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.environmentDetails.storageSize }}
{{- end }}
