{{- if not .Values.adx.enabled }}
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: akernel-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: akernel-frontend
    {{- with .Values.frontend.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if eq (default "ClusterIP" .Values.frontend.service.type) "ClusterIP" }}
  clusterIP: None
  {{- end }}
  type: {{ default "ClusterIP" .Values.frontend.service.type }}
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
  selector:
    app: akernel-frontend
  sessionAffinity: None
{{- end }}
{{- end }}
