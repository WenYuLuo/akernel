{{- if .Values.adx.enabled }}
{{- if not (has .Values.adx.redis.mode (list "managed" "external")) }}
{{- fail "adx.redis.mode must be managed or external" }}
{{- end }}
{{- if and (eq .Values.adx.redis.mode "external") (not .Values.adx.redis.external.existingSecret) }}
{{- fail "adx.redis.external.existingSecret is required in external mode" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: akernel-adx-config
  namespace: {{ .Release.Namespace }}
data:
  control.yaml: |
    schema_version: 1
    package_dir: /opt/adx/current
    state_dir: /var/lib/adx
    redis_url: ${ADX_REDIS_URL}
    namespace: {{ .Values.adx.namespace | quote }}
    restart_limit: 3
    restart_delay_ms: 1000
    stop_timeout_seconds: 90
    services:
      - id: master
        role: master
        config:
          listen: 0.0.0.0:19000
          advertised_address: https://akernel-adx-control.{{ .Release.Namespace }}.svc.cluster.local:19000
          scheduler_shards: {{ .Values.adx.schedulerShards }}
          placement: {{ .Values.adx.placement | quote }}
          rpc_timeout_seconds: 30
          heartbeat_timeout_seconds: 30
          discovery_ttl_seconds: 15
          metrics_listen: 0.0.0.0:19090
          tls:
            ca: /etc/adx/tls/ca.pem
            certificate: /etc/adx/tls/master.pem
            private_key: /etc/adx/tls/master.key
            server_name: {{ .Values.adx.tls.serverName | quote }}
            peers:
              api-server: /etc/adx/tls/api-server.der
              node-pool: /etc/adx/tls/node.der
              edge: /etc/adx/tls/edge.der
          bootstrap_credentials:
            - key_file: /etc/adx/secrets/admin-key
              tenant_id: admin
              administrator: true
              expires_at_unix_seconds: 0
      - id: api-server
        role: api-server
        config:
          listen: 127.0.0.1:18888
          ca: /etc/adx/tls/ca.pem
          certificate: /etc/adx/tls/api-server.pem
          private_key: /etc/adx/tls/api-server.key
          server_name: {{ .Values.adx.tls.serverName | quote }}
          rpc_timeout_seconds: 90
          cache_entries: 10000
          auth_cache_ttl_seconds: 10
          agent_address: ""
          loopback_http: true
      - id: edge
        role: edge
        config:
          rpc_timeout_seconds: 5
          refresh_seconds: 2
          auth_cache_seconds: 10
          auth_cache_entries: 4096
          tls:
            ca: /etc/adx/tls/ca.pem
            certificate: /etc/adx/tls/edge.pem
            private_key: /etc/adx/tls/edge.key
            server_name: {{ .Values.adx.tls.serverName | quote }}
            peers:
              master: /etc/adx/tls/master.der
        env:
          ADX_DATA_PLANE_EDGE_FRONTEND_CONTROL_PLANE_ROUTES: exact:/,exact:/healthz,prefix:/api/instances,prefix:/api/sandbox,prefix:/api/admin/v1/keys
          ADX_DATA_PLANE_EDGE_FRONTEND_TLS_BIND: 0.0.0.0:8443
          ADX_DATA_PLANE_EDGE_FRONTEND_PLAIN_BIND: 0.0.0.0:8080
          ADX_DATA_PLANE_EDGE_FRONTEND_HEALTH_BIND: 0.0.0.0:18080
          ADX_DATA_PLANE_EDGE_FRONTEND_TLS_CERT: /etc/adx/tls/public.pem
          ADX_DATA_PLANE_EDGE_FRONTEND_TLS_KEY: /etc/adx/tls/public.key
          ADX_DATA_PLANE_EDGE_FRONTEND_ALLOWED_CLIENT_CIDRS: 0.0.0.0/0
          ADX_DATA_PLANE_EDGE_FRONTEND_CONTROL_PLANE_ADDRESS: 127.0.0.1:18888
          ADX_DATA_PLANE_EDGE_FRONTEND_NODE_SECURITY_MODE: mtls
          ADX_DATA_PLANE_EDGE_FRONTEND_NODE_TLS_CA: /etc/adx/tls/ca.pem
          ADX_DATA_PLANE_EDGE_FRONTEND_NODE_TLS_SERVER_NAME: {{ .Values.adx.tls.serverName | quote }}
          ADX_DATA_PLANE_EDGE_FRONTEND_NODE_TLS_CLIENT_CERT: /etc/adx/tls/edge.pem
          ADX_DATA_PLANE_EDGE_FRONTEND_NODE_TLS_CLIENT_KEY: /etc/adx/tls/edge.key
    logging:
      enabled: true
      max_file_bytes: 104857600
      rotate_seconds: 86400
      compress: true
      max_files: 5
      max_age_seconds: 604800
      max_total_bytes: 1073741824
    environment:
      rootfs:
        runtime_class: runsc
        type: local
        path: /opt/akernel/runtime/akernel-runtime-rootfs.img
        readonly: false
      bootstrap:
        type: erofs
        root: /opt/akernel/runtime/akernel-runtime-rootfs.img
        target: /__adx
        entrypoint:
          - /__adx/usr/local/bin/rrt-runtime
        image_process_config: /etc/adx-image-process.json
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  node.yaml: |
    schema_version: 1
    package_dir: /opt/adx/current
    state_dir: /home/akernel/adx/run
    redis_url: ${ADX_REDIS_URL}
    namespace: {{ .Values.adx.namespace | quote }}
    restart_limit: 3
    restart_delay_ms: 1000
    stop_timeout_seconds: 90
    services:
      - id: node-manager
        role: node-manager
        config:
          node_id: ${NODE_NAME}
          listen: 0.0.0.0:19001
          advertised_address: ${INSTANCE_IP}:19001
          proxy_address: ${INSTANCE_IP}:19002
          sandboxd_socket: /run/sandboxd/sandboxd.sock
          proxy_socket: /home/akernel/adx/run/route.sock
          report_interval_seconds: {{ .Values.adx.node.reportIntervalSeconds }}
          rpc_timeout_seconds: 30
          rrt_port: 50090
          rrt_env: {}
          checkpoint_dir: /home/akernel/adx/checkpoints
          degradation_journal: /home/akernel/adx/degraded/results.sqlite
          metrics_listen: 0.0.0.0:19091
          resource_source:
            kind: auto
            disk_path: /home/akernel
            valid_for_seconds: {{ .Values.adx.node.resourceValidForSeconds }}
          tls:
            ca: /etc/adx/tls/ca.pem
            certificate: /etc/adx/tls/node.pem
            private_key: /etc/adx/tls/node.key
            server_name: {{ .Values.adx.tls.serverName | quote }}
            peers:
              master: /etc/adx/tls/master.der
              api-server: /etc/adx/tls/api-server.der
        env:
          ADX_DATA_PLANE_NODE_PROXY_ACTIVITY_UDS_DIR: /home/akernel/adx/run
          ADX_DATA_PLANE_NODE_PROXY_BIND: 0.0.0.0:19002
          ADX_DATA_PLANE_NODE_PROXY_ADVERTISE_ADDRESS: ${INSTANCE_IP}:19002
          ADX_DATA_PLANE_ALLOWED_TARGET_CIDRS: {{ .Values.adx.node.allowedTargetCidrs | quote }}
          ADX_DATA_PLANE_ALLOWED_EDGE_CIDRS: {{ .Values.adx.node.allowedEdgeCidrs | quote }}
          ADX_DATA_PLANE_EDGE_FRONTEND_NODE_SECURITY_MODE: mtls
          ADX_DATA_PLANE_NODE_PROXY_TLS_CERT: /etc/adx/tls/node.pem
          ADX_DATA_PLANE_NODE_PROXY_TLS_KEY: /etc/adx/tls/node.key
          ADX_DATA_PLANE_NODE_PROXY_MTLS_CLIENT_CA: /etc/adx/tls/ca.pem
    logging:
      enabled: true
      max_file_bytes: 104857600
      rotate_seconds: 86400
      compress: true
      max_files: 5
      max_age_seconds: 604800
      max_total_bytes: 1073741824
    environment:
      rootfs:
        runtime_class: runsc
        type: local
        path: /opt/akernel/runtime/akernel-runtime-rootfs.img
        readonly: false
      bootstrap:
        type: erofs
        root: /opt/akernel/runtime/akernel-runtime-rootfs.img
        target: /__adx
        entrypoint:
          - /__adx/usr/local/bin/rrt-runtime
        image_process_config: /etc/adx-image-process.json
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
{{- end }}
