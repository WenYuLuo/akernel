{{- if ne (int .Values.adx.control.replicas) 1 }}
{{- fail "adx.control.replicas must be 1 while ADX uses a single active Master" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: akernel-adx-control
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: akernel-adx-control
  ports:
    - name: master
      port: 19000
      targetPort: master
    - name: edge-control
      port: 8443
      targetPort: edge-control
    - name: edge-data
      port: 8080
      targetPort: edge-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akernel-adx-control
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.adx.control.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: akernel-adx-control
  template:
    metadata:
      labels:
        app: akernel-adx-control
      annotations:
        checksum/adx-config: {{ include (print $.Template.BasePath "/adx/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control
          image: "{{ include "core.image" (dict "root" . "image" .Values.master.image) }}"
          imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.master.image) }}
          command:
            - /opt/adx/current/bin/adxctl
          args:
            - --config
            - /etc/akernel/adx-control.yaml
            - run
          env:
            {{- if eq .Values.adx.redis.mode "managed" }}
            - name: ADX_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akernel-adx-redis-auth
                  key: password
            {{- end }}
            - name: ADX_REDIS_URL
              {{- if eq .Values.adx.redis.mode "managed" }}
              value: redis://:$(ADX_REDIS_PASSWORD)@akernel-adx-redis.{{ .Release.Namespace }}.svc.cluster.local:6379/
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adx.redis.external.existingSecret | quote }}
                  key: {{ .Values.adx.redis.external.urlKey | quote }}
              {{- end }}
          ports:
            - name: master
              containerPort: 19000
            - name: edge-control
              containerPort: 8443
            - name: edge-data
              containerPort: 8080
            - name: health
              containerPort: 18080
            - name: master-metrics
              containerPort: 19090
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - 'exec 3<>/dev/tcp/127.0.0.1/19000; curl --fail --silent --max-time 2 http://127.0.0.1:18080/healthz >/dev/null'
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - 'exec 3<>/dev/tcp/127.0.0.1/19000; curl --fail --silent --max-time 2 http://127.0.0.1:18080/healthz >/dev/null'
            timeoutSeconds: 3
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.adx.control.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/akernel/adx-control.yaml
              subPath: control.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/adx
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: akernel-adx-config
        - name: credentials
          secret:
            secretName: {{ .Values.adx.tls.existingSecret | quote }}
            defaultMode: 0400
            items:
              - {key: public.pem, path: tls/public.pem}
              - {key: public.key, path: tls/public.key}
              - {key: admin-key, path: secrets/admin-key}
