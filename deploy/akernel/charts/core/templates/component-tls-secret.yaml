{{- if and (not .Values.adx.enabled) (not .Values.componentTLS.existingSecret) }}
{{- $secretName := include "core.componentTLSSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $dnsNames := list
      "akernel-master"
      (printf "akernel-master.%s" .Release.Namespace)
      (printf "akernel-master.%s.svc" .Release.Namespace)
      (printf "akernel-master.%s.svc.cluster.local" .Release.Namespace)
      "akernel-frontend"
      (printf "akernel-frontend.%s" .Release.Namespace)
      (printf "akernel-frontend.%s.svc" .Release.Namespace)
      (printf "akernel-frontend.%s.svc.cluster.local" .Release.Namespace) -}}
{{- $hasExplicitTLS := or .Values.componentTLS.caCrt .Values.componentTLS.moduleCrt .Values.componentTLS.moduleKey -}}
{{- if and $hasExplicitTLS (not (and .Values.componentTLS.caCrt .Values.componentTLS.moduleCrt .Values.componentTLS.moduleKey)) -}}
{{- fail "componentTLS.caCrt, componentTLS.moduleCrt, and componentTLS.moduleKey must be supplied together" -}}
{{- end -}}
{{- $ca := genCA "akernel-component-ca" 3650 -}}
{{- $generated := genSignedCert "akernel-component" nil $dnsNames 3650 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: akernel
    app.kubernetes.io/component: component-tls
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "ca.crt") (index $existing.data "module.crt") (index $existing.data "module.key") }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  module.crt: {{ index $existing.data "module.crt" }}
  module.key: {{ index $existing.data "module.key" }}
  {{- else if $hasExplicitTLS }}
  ca.crt: {{ .Values.componentTLS.caCrt | b64enc }}
  module.crt: {{ .Values.componentTLS.moduleCrt | b64enc }}
  module.key: {{ .Values.componentTLS.moduleKey | b64enc }}
  {{- else }}
  ca.crt: {{ $ca.Cert | b64enc }}
  module.crt: {{ $generated.Cert | b64enc }}
  module.key: {{ $generated.Key | b64enc }}
  {{- end }}
{{- end }}
