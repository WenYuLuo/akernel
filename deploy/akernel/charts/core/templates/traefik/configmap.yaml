{{- if .Values.traefik.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-static
  namespace: {{ .Release.Namespace }}
data:
  traefik.yml: |
    entryPoints:
      {{- if .Values.traefik.enableWebEntrypoint }}
      websecure:
        address: ":{{ .Values.traefik.ports.websecure }}"
      web:
        address: ":{{ .Values.traefik.ports.web }}"
      {{- else }}
      websecure:
        address: ":{{ .Values.traefik.ports.tcp }}"
      {{- end }}
      traefik:
        address: ":{{ .Values.traefik.ports.dashboard }}"

    {{- $masterEtcd := .Values.master.etcd | default dict }}
    {{- $etcdHost := get $masterEtcd "host" | default (printf "akernel-etcd.%s.svc.cluster.local" .Release.Namespace) }}
    {{- $etcdPort := get $masterEtcd "port" | default "2379" }}
    {{- $masterHost := .Values.master.host | default (printf "akernel-master.%s.svc.cluster.local" .Release.Namespace) }}
    {{- $masterPort := .Values.master.port | default "22770" }}
    providers:
      file:
        directory: /etc/traefik/dynamic
        watch: true
      {{- if eq (.Values.traefik.mode | default "http") "http" }}
      http:
        endpoint: "http://{{ $masterHost }}:{{ $masterPort }}/global-scheduler/traefik/config"
        pollInterval: "1s"
      {{- else }}
      etcd:
        endpoints:
          - "{{ $etcdHost }}:{{ $etcdPort }}"
        rootKey: "traefik"
      {{- end }}

    ping: {}

    api:
      dashboard: true
      insecure: true

    log:
      level: INFO
      filePath: /var/logs/traefik.log

    accessLog:
      format: json
      fields:
        names:
          # Exec places authentication data in the websocket query string.
          # Keep status and timing fields, but never persist the request path.
          RequestPath: drop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: {{ .Release.Namespace }}
data:
  config.yml: |
    {{- if .Values.traefik.tls.enabled }}
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /openyuanrong/cert/module.crt
            keyFile: /openyuanrong/cert/module.key
      certificates:
        - certFile: /openyuanrong/cert/module.crt
          keyFile: /openyuanrong/cert/module.key
    {{- end }}

    http:
      routers:
        frontend-terminal:
          entryPoints:
            - websecure
          rule: "PathPrefix(`/terminal`) || PathPrefix(`/api/instances`) || PathPrefix(`/api/jobs`) || PathPrefix(`/functions`) || PathPrefix(`/api-docs`) || PathPrefix(`/admin/v1/functions`) || PathPrefix(`/serverless/v1/functions`) || PathPrefix(`/serverless/v1/stream`) || PathPrefix(`/serverless/v1/componentshealth`) || PathPrefix(`/serverless/v1/posix`) || PathPrefix(`/serverless/v2`) || PathPrefix(`/frontend/v1/instance`) || PathPrefix(`/datasystem/v1`) || PathPrefix(`/app/v1`) || PathPrefix(`/client/v1/lease`) || PathPrefix(`/invocations`) || PathPrefix(`/global-scheduler`) || Path(`/healthz`)"
          service: {{ if .Values.frontend.enabled }}akernel-frontend{{ else }}akernel-master{{ end }}
          tls: {}
        sandbox-router:
          entryPoints:
            - websecure
          rule: "PathPrefix(`/api/sandbox`) || PathPrefix(`/direct/`) || Path(`/direct`)"
          priority: 100
          service: {{ if .Values.frontend.enabled }}akernel-frontend{{ else }}akernel-master{{ end }}
          tls: {}
        {{- if .Values.traefik.grafana.enabled }}
        grafana:
          entryPoints:
            - websecure
          rule: "PathPrefix(`/grafana`)"
          service: grafana
          tls: {}
        {{- end }}
        {{- if .Values.traefik.internalStats.enabled }}
        internal-stats:
          entryPoints:
            - websecure
          rule: "Path(`/internal-stats`)"
          service: internal-stats
          middlewares:
            - internal-stats-strip
          tls: {}
        {{- end }}

      services:
        {{ if .Values.frontend.enabled }}akernel-frontend{{ else }}akernel-master{{ end }}:
          loadBalancer:
            serversTransport: frontend-transport
            servers:
              - url: "https://{{ if .Values.frontend.enabled }}akernel-frontend{{ else }}akernel-master{{ end }}:8888"
        {{- if .Values.traefik.grafana.enabled }}
        grafana:
          loadBalancer:
            servers:
              - url: "{{ .Values.traefik.grafana.url }}"
        {{- end }}
        {{- if .Values.traefik.internalStats.enabled }}
        internal-stats:
          loadBalancer:
            servers:
              - url: "http://localhost:{{ .Values.traefik.internalStats.port }}"
        {{- end }}

      {{- if .Values.traefik.internalStats.enabled }}
      middlewares:
        internal-stats-strip:
          stripPrefix:
            prefixes:
              - "/internal-stats"
      {{- end }}

      serversTransports:
        frontend-transport:
          insecureSkipVerify: true
          {{- if .Values.traefik.frontendTransport.disableHTTP2 }}
          # Force HTTP/1.1 to the frontend backend. With an HTTP/2 backend,
          # Traefik multiplexes all requests over a single connection; the 1s
          # full-config reloads (390+ churning per-sandbox routes) drain and
          # rebuild that connection, stalling in-flight requests for 7-10s.
          # An HTTP/1.1 connection pool is unaffected.
          disableHTTP2: true
          {{- end }}
{{- end }}
